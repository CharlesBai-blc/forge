<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge - Log in</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.45 system-ui, sans-serif; margin: 1.25rem; max-width: 24rem; }
    h1 { font-size: 1.35rem; margin: 0 0 1rem; }
    label { display: block; margin: 0.75rem 0 0.25rem; }
    input { width: 100%; padding: 0.4rem 0.5rem; font: inherit; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 0.45rem 1rem; font: inherit; cursor: pointer; }
    .err { color: #c0392b; margin-top: 0.75rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Forge</h1>
  <form id="f">
    <label for="username">Username</label>
    <input id="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <p class="err" id="err"></p>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async e => {
      e.preventDefault();
      const r = await fetch('/v1/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      if (r.ok) { location.reload(); return; }
      document.getElementById('err').textContent =
        r.status === 401 ? 'Wrong username or password.' : 'Login failed (' + r.status + ').';
    });
  </script>
</body>
</html>
