name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
  isolation:
    # FR-17: hardened-profile isolation suite against a real Docker daemon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: FORGE_ISOLATION_TESTS=1 go test ./internal/sandbox/docker/ -run TestIsolation -v
  chaos:
    # NFR-3: forced worker-kill and control-plane restart trials, with
    # the race detector on the claim/reclaim paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./internal/api/ -run TestChaos -race -v
  soak-smoke:
    # NFR-4 harness, short smoke: 50 concurrent simulated agents against
    # a real control plane; fails on any lost, failed, or duplicated
    # job. The 24h acceptance run uses the same binary (bench/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go run ./bench/soak -duration 45s -job 1s
