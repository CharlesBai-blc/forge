name: forge-bench
on:
  workflow_dispatch:
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: hosted
            labels: ubuntu-latest
          - variant: forge
            labels: [self-hosted, forge]
    name: bench-${{ matrix.variant }}
    runs-on: ${{ matrix.labels }}
    steps:
      - name: Record host
        run: |
          uname -a
          nproc || getconf _NPROCESSORS_ONLN
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: false
      - name: Compile the standard library and toolchain from scratch
        run: go build -a std cmd
      - name: Test standard library packages
        run: go test -count=1 -short archive/... bufio bytes compress/... container/... encoding/... fmt hash/... image/... index/... math/... regexp/... sort/... strconv strings text/... unicode/...
